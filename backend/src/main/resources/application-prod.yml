# Profil de production (active par le Dockerfile). Aucun fichier .env : tout vient de l'environnement.
spring:
  datasource:
    # SSL obligatoire (Neon) ; DB_SSLMODE=disable uniquement pour tester l'image contre une base locale
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}?sslmode=${DB_SSLMODE:require}
    hikari:
      # Offre gratuite : peu de connexions, et aucune connexion gardee ouverte au repos
      # pour laisser la base se mettre en veille (Neon facture le temps de calcul actif)
      maximum-pool-size: 5
      minimum-idle: 0
      idle-timeout: 60000
      # Le reveil d'une base en veille prend quelques secondes
      connection-timeout: 30000

server:
  # Render fournit le port d'ecoute dans PORT
  port: ${PORT:8080}

smartshop:
  cors:
    # Obligatoire en production : URL du frontend (ex. https://smartshop-demo.netlify.app)
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

logging:
  level:
    com.smartshop: INFO

# Configuration commune. Les valeurs sensibles viennent TOUJOURS de variables d'environnement.
spring:
  application:
    name: smartshop
  profiles:
    default: dev
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:smartshop}
    username: ${DB_USERNAME:smartshop}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # le schema est gere exclusivement par Flyway
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  data:
    web:
      pageable:
        max-page-size: 100
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
  error:
    include-stacktrace: never
    include-message: never

smartshop:
  security:
    jwt:
      secret: ${JWT_SECRET}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
      refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:7d}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  bootstrap-admin:
    username: ${ADMIN_USERNAME:admin}
    email: ${ADMIN_EMAIL:admin@smartshop.local}
    password: ${ADMIN_PASSWORD:}

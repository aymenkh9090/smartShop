# Infrastructure de developpement SmartShop.
# Les identifiants sont lus depuis le fichier .env (voir .env.example).
name: smartshop

services:
  postgres:
    image: postgres:17-alpine
    container_name: smartshop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-smartshop}
      POSTGRES_USER: ${DB_USERNAME:-smartshop}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD doit etre defini dans .env}
      TZ: UTC
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres-data:

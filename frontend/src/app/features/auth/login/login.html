<section class="login">
  <h1>SmartShop</h1>
  <h2>Connexion</h2>

  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <mat-form-field>
      <mat-label>Nom d'utilisateur ou email</mat-label>
      <input matInput id="username" formControlName="username" autocomplete="username" />
      <mat-error>{{ errorOf(form.controls.username) }}</mat-error>
    </mat-form-field>

    <mat-form-field>
      <mat-label>Mot de passe</mat-label>
      <input matInput id="password" type="password" formControlName="password" autocomplete="current-password" />
      <mat-error>{{ errorOf(form.controls.password) }}</mat-error>
    </mat-form-field>

    @if (errorMessage(); as message) {
      <p class="form-error" role="alert">{{ message }}</p>
    }

    <button mat-flat-button type="submit" [disabled]="submitting()">
      {{ submitting() ? 'Connexion...' : 'Se connecter' }}
    </button>
  </form>
</section>

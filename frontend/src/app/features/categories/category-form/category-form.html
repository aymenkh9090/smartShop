<div class="page-header">
  <h2>{{ isEdit() ? 'Modifier la catégorie' : 'Nouvelle catégorie' }}</h2>
</div>

<form class="form-card" [formGroup]="form" (ngSubmit)="submit()" novalidate>
  <div class="form-grid">
    <mat-form-field class="full-width">
      <mat-label>Nom</mat-label>
      <input matInput formControlName="name" />
      <mat-error>{{ errorOf(form.controls.name) }}</mat-error>
    </mat-form-field>
    <mat-form-field class="full-width">
      <mat-label>Description</mat-label>
      <textarea matInput formControlName="description" rows="3"></textarea>
      <mat-error>{{ errorOf(form.controls.description) }}</mat-error>
    </mat-form-field>
  </div>
  <div class="form-actions">
    <a mat-button routerLink="/categories">Annuler</a>
    <button mat-flat-button type="submit" [disabled]="submitting()">Enregistrer</button>
  </div>
</form>

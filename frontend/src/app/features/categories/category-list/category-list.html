<div class="page-header">
  <div class="page-title">
    <h2>Catégories</h2>
    <p class="page-subtitle">Organisez le catalogue par familles de produits</p>
  </div>
  @if (canManage()) {
    <a mat-flat-button routerLink="new"><mat-icon>add</mat-icon> Nouvelle catégorie</a>
  }
</div>

@if (loading()) {
  <mat-progress-bar mode="indeterminate" />
}
<div class="table-container">
  <table mat-table [dataSource]="categories()">
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>Nom</th>
      <td mat-cell *matCellDef="let c">{{ c.name }}</td>
    </ng-container>
    <ng-container matColumnDef="description">
      <th mat-header-cell *matHeaderCellDef>Description</th>
      <td mat-cell *matCellDef="let c">{{ c.description }}</td>
    </ng-container>
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let c" class="actions-cell">
        <a mat-icon-button [routerLink]="[c.id, 'edit']" matTooltip="Modifier" aria-label="Modifier">
          <mat-icon>edit</mat-icon>
        </a>
        <button mat-icon-button type="button" (click)="remove(c)" matTooltip="Supprimer" aria-label="Supprimer">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="columns()"></tr>
    <tr mat-row *matRowDef="let row; columns: columns()"></tr>
    <tr class="mat-mdc-row" *matNoDataRow>
      <td class="no-data" [attr.colspan]="columns().length">Aucune catégorie.</td>
    </tr>
  </table>
</div>

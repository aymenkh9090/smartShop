<header class="app-header">
  <h1>{{ appName }}</h1>
  @if (auth.currentUser(); as user) {
    <div class="user-menu">
      <span>{{ user.firstName }} {{ user.lastName }} ({{ user.role }})</span>
      <button type="button" (click)="auth.logout()">Deconnexion</button>
    </div>
  }
</header>
<main class="app-content">
  <router-outlet />
</main>
